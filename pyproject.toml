[project]
name = "canvaspilot"
version = "0.1.1"
description = "Agentic Canvas LMS MCP + CLI — curated tools + full /api/v1 escape hatch; session broker or PAT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jacob-Met" }]
keywords = ["canvas", "canvas-lms", "instructure", "mcp", "model-context-protocol", "agent", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0.0,<3",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/Jacob-Met/canvaspilot"
Repository = "https://github.com/Jacob-Met/canvaspilot"
Issues = "https://github.com/Jacob-Met/canvaspilot/issues"

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.4", "canvaspilot[browser]"]

[project.scripts]
canvaspilot = "canvaspilot.cli:main"
canvaspilot-session = "canvaspilot.session_broker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvaspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
